
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EmpowerHer — Data Quality Dashboard</title>

<style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --text: #202124;
  --muted: #5f6368;
  --accent: #1a73e8;
  --warn: #fbbc04;
  --bad: #d93025;
  --good: #188038;
  --border: #e3e6ea;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14161a;
    --card: #1e2127;
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #8ab4f8;
    --warn: #fdd663;
    --bad: #f28b82;
    --good: #81c995;
    --border: #33363d;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #14161a;
  --card: #1e2127;
  --text: #e8eaed;
  --muted: #9aa0a6;
  --accent: #8ab4f8;
  --warn: #fdd663;
  --bad: #f28b82;
  --good: #81c995;
  --border: #33363d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
               Roboto, Helvetica, Arial, sans-serif;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

header {
  padding: 20px 24px;
  background: var(--accent);
  color: #fff;
  display: flex;
  flex-wrap: wrap;
  gap: 15px;
  align-items: center;
  justify-content: space-between;
}

header h1 {
  margin: 0;
  font-size: 1.3rem;
}

header .meta {
  font-size: .85rem;
  opacity: .9;
  margin-top: 5px;
}

.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}

#configUrl {
  padding: 9px 10px;
  border-radius: 6px;
  border: none;
  width: 360px;
  max-width: 100%;
  font-size: .85rem;
}

button {
  background: #fff;
  color: var(--accent);
  border: none;
  border-radius: 6px;
  padding: 9px 14px;
  font-weight: 600;
  cursor: pointer;
  font-size: .85rem;
}

button:hover {
  opacity: .9;
}

main {
  padding: 20px;
  max-width: 1400px;
  margin: 0 auto;
}

.summary {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
  margin-bottom: 20px;
}

.summary .card {
  flex: 1 1 200px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  text-align: center;
}

.summary .num {
  font-size: 1.8rem;
  font-weight: 700;
  color: var(--bad);
}

.summary .num.zero {
  color: var(--good);
}

.summary .label {
  font-size: .85rem;
  color: var(--muted);
  margin-top: 6px;
}

.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-bottom: 20px;
  overflow: hidden;
}

.panel-header {
  padding: 14px 18px;
  background: var(--warn);
  color: #202124;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  flex-wrap: wrap;
  gap: 8px;
}

.panel-header .count {
  font-weight: 700;
  background: rgba(0,0,0,.15);
  padding: 3px 10px;
  border-radius: 12px;
  font-size: .85rem;
}

.table-wrap {
  overflow: auto;
  max-height: 65vh;
}

table {
  border-collapse: collapse;
  width: 100%;
  font-size: .85rem;
}

th, td {
  padding: 9px 11px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  text-align: left;
}

th {
  background: var(--accent);
  color: #fff;
  position: sticky;
  top: 0;
  z-index: 1;
}

tbody tr:nth-child(even) {
  background: rgba(128,128,128,.06);
}

tbody tr:hover {
  background: rgba(26,115,232,.08);
}

.empty-msg {
  padding: 18px;
  color: var(--good);
  font-weight: 600;
}

.loading, .error-msg, .info-msg {
  padding: 35px 20px;
  text-align: center;
  color: var(--muted);
}

.error-msg {
  color: var(--bad);
}

footer {
  text-align: center;
  padding: 20px;
  color: var(--muted);
  font-size: .8rem;
}

@media (max-width: 700px) {
  header {
    padding: 16px;
  }

  header h1 {
    font-size: 1.1rem;
  }

  #configUrl {
    width: 100%;
    max-width: 100%;
  }

  .controls {
    width: 100%;
  }

  main {
    padding: 12px;
  }
}
</style>
</head>

<body>

<header>
  <div>
    <h1>EmpowerHer — Data Quality Dashboard</h1>
    <div class="meta" id="generatedAt">Connecting...</div>
  </div>

  <div class="controls">
    <input
      id="configUrl"
      type="text"
      placeholder="Apps Script Web App URL"
      aria-label="Apps Script Web App URL"
    >
    <button onclick="saveUrlAndLoad()">Load</button>
    <button onclick="loadData()">Refresh</button>
  </div>
</header>

<main>
  <div class="summary" id="summaryCards"></div>
  <div id="sections"></div>
  <div id="status"></div>
</main>

<footer>
  EmpowerHer Data Quality Monitoring · Live report
</footer>

<script>
/* =========================================================
   CONFIGURATION
   Existing Apps Script Web App deployment URL
========================================================= */

const DEFAULT_WEB_APP_URL =
  "https://script.google.com/macros/s/AKfycbzYFL0NUXq-8VTzEMtqj-ugayehKAxc_WSAHdJo0eDDDvPb_2gAf_42eibFlsBfDikhtw/exec";

const STORAGE_KEY = "empowerher_webapp_url";
const JSONP_TIMEOUT_MS = 30000;


/* =========================================================
   URL SETTINGS
========================================================= */

function getWebAppUrl() {
  try {
    return localStorage.getItem(STORAGE_KEY) || DEFAULT_WEB_APP_URL;
  } catch (e) {
    return DEFAULT_WEB_APP_URL;
  }
}

function saveUrlAndLoad() {
  const input = document.getElementById("configUrl");
  const value = input.value.trim();

  if (value) {
    try {
      localStorage.setItem(STORAGE_KEY, value);
    } catch (e) {}
  }

  loadData();
}


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {
  if (value === null || value === undefined) return "";

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function showStatus(message, className) {
  document.getElementById("status").innerHTML =
    '<div class="' + className + '">' + escapeHtml(message) + '</div>';
}

function clearStatus() {
  document.getElementById("status").innerHTML = "";
}


/* =========================================================
   JSONP REQUEST

   Uses Apps Script JSONP parameter "prefix".
   The Apps Script doGet() must support JSONP and return
   JavaScript in the form:

   callbackName({"sections":[...],"generatedAt":"..."});

========================================================= */

function requestJsonp(url, timeoutMs) {
  return new Promise((resolve, reject) => {
    const callbackName =
      "empowerHerDQCallback_" + Date.now() + "_" +
      Math.floor(Math.random() * 1000000);

    let script;
    let timeout;

    function cleanup() {
      if (script && script.parentNode) {
        script.parentNode.removeChild(script);
      }

      if (timeout) clearTimeout(timeout);

      try {
        delete window[callbackName];
      } catch (e) {
        window[callbackName] = undefined;
      }
    }

    window[callbackName] = function(data) {
      cleanup();
      resolve(data);
    };

    script = document.createElement("script");

    script.onerror = function() {
      cleanup();
      reject(new Error(
        "The Apps Script request failed. Check deployment access and JSONP support."
      ));
    };

    timeout = setTimeout(() => {
      cleanup();
      reject(new Error(
        "Request timed out. The Apps Script endpoint did not respond."
      ));
    }, timeoutMs);

    try {
      const requestUrl = new URL(url);
      requestUrl.searchParams.set("prefix", callbackName);
      requestUrl.searchParams.set("_", Date.now());

      script.src = requestUrl.toString();
      script.async = true;
      document.body.appendChild(script);
    } catch (error) {
      cleanup();
      reject(new Error("Invalid Web App URL."));
    }
  });
}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData() {
  const url = getWebAppUrl();

  document.getElementById("configUrl").value = url;

  document.getElementById("summaryCards").innerHTML = "";
  document.getElementById("sections").innerHTML = "";

  showStatus("Loading latest data...", "loading");

  try {
    const data = await requestJsonp(url, JSONP_TIMEOUT_MS);

    if (!data || !Array.isArray(data.sections)) {
      throw new Error(
        "The endpoint responded, but the expected sections data is missing."
      );
    }

    clearStatus();
    render(data);

  } catch (error) {
    showStatus(
      "Could not load data: " + error.message,
      "error-msg"
    );
  }
}


/* =========================================================
   RENDER DASHBOARD
========================================================= */

function render(data) {
  const generatedEl = document.getElementById("generatedAt");

  if (data.generatedAt) {
    const date = new Date(data.generatedAt);

    generatedEl.textContent = isNaN(date.getTime())
      ? "Last generated: " + data.generatedAt
      : "Last generated: " + date.toLocaleString();
  } else {
    generatedEl.textContent = "Data Quality Report";
  }

  const summaryEl = document.getElementById("summaryCards");
  const sectionsEl = document.getElementById("sections");

  summaryEl.innerHTML = "";
  sectionsEl.innerHTML = "";

  const sections = data.sections || [];

  sections.forEach((section, index) => {
    const rows = Array.isArray(section.rows) ? section.rows : [];
    const columns = Array.isArray(section.columns) ? section.columns : [];
    const count = rows.length;

    /* Summary card */
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML =
      '<div class="num ' + (count === 0 ? "zero" : "") + '">' +
        count +
      '</div>' +
      '<div class="label">' +
        escapeHtml(section.title || ("Category " + (index + 1))) +
      '</div>';

    summaryEl.appendChild(card);


    /* Category panel */
    const panel = document.createElement("section");
    panel.className = "panel";

    const header = document.createElement("div");
    header.className = "panel-header";

    header.innerHTML =
      '<span>' + escapeHtml(section.title || "Untitled category") + '</span>' +
      '<span class="count">' + count + ' row(s)</span>';

    const body = document.createElement("div");
    body.className = "table-wrap";
    body.style.display = "block";

    if (count === 0) {
      body.innerHTML =
        '<div class="empty-msg">No issues found in this category.</div>';
    } else if (columns.length === 0) {
      body.innerHTML =
        '<div class="error-msg">Column headings were not provided.</div>';
    } else {
      const table = document.createElement("table");

      /* Table header */
      const thead = document.createElement("thead");
      const headerRow = document.createElement("tr");

      columns.forEach(column => {
        const th = document.createElement("th");
        th.textContent = column;
        headerRow.appendChild(th);
      });

      thead.appendChild(headerRow);
      table.appendChild(thead);

      /* Table rows */
      const tbody = document.createElement("tbody");

      rows.forEach(row => {
        const tr = document.createElement("tr");

        columns.forEach((column, cellIndex) => {
          const td = document.createElement("td");
          td.textContent =
            row && row[cellIndex] !== undefined && row[cellIndex] !== null
              ? String(row[cellIndex])
              : "";
          tr.appendChild(td);
        });

        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      body.appendChild(table);
    }

    /* Collapse / expand */
    header.addEventListener("click", () => {
      body.style.display =
        body.style.display === "none" ? "block" : "none";
    });

    panel.appendChild(header);
    panel.appendChild(body);
    sectionsEl.appendChild(panel);
  });

  if (sections.length === 0) {
    sectionsEl.innerHTML =
      '<div class="empty-msg">No sections returned by the API.</div>';
  }
}


/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("configUrl").value = getWebAppUrl();
  loadData();
});
</script>

</body>
</html>
