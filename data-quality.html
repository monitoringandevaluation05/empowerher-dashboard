<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EmpowerHer — Data Quality Dashboard</title>
<style>
  :root{
    --bg:#f1f4f3; --card:#ffffff; --card-alt:#f6f9f8; --text:#16221e; --muted:#5d6b66;
    --accent:#0f8a7c; --accent-dark:#0b5f56; --accent-soft:#e3f4f1;
    --warn:#c77b12; --bad:#c23b2e; --good:#1c8a53;
    --border:#dfe6e3; --header-bg:#0b1f1c;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0c1210; --card:#141b19; --card-alt:#192120; --text:#e9f2ef; --muted:#93a39d;
      --accent:#2dd4c0; --accent-dark:#1f9c8e; --accent-soft:#102723;
      --warn:#e0a94d; --bad:#ef6b5e; --good:#4fd896;
      --border:#253230; --header-bg:#070d0b;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0c1210; --card:#141b19; --card-alt:#192120; --text:#e9f2ef; --muted:#93a39d;
    --accent:#2dd4c0; --accent-dark:#1f9c8e; --accent-soft:#102723;
    --warn:#e0a94d; --bad:#ef6b5e; --good:#4fd896;
    --border:#253230; --header-bg:#070d0b;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; scroll-padding-top:120px;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body::before{
    content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px);
    background:var(--header-bg); z-index:40;
  }

  header.hero{
    padding:22px clamp(16px,4vw,40px) 16px; background:linear-gradient(135deg,var(--header-bg),var(--accent-dark));
    color:#fff;
  }
  .hero-top{display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between;}
  .hero-top h1{margin:0; font-size:1.4rem; letter-spacing:-0.01em;}
  .hero-top .meta{font-size:0.82rem; opacity:0.75; margin-top:2px;}
  button#refreshBtn{
    background:#fff; color:var(--accent-dark); border:none; border-radius:8px;
    padding:9px 16px; font-weight:700; cursor:pointer; font-size:0.85rem;
    display:inline-flex; align-items:center; gap:6px; box-shadow:0 1px 2px rgba(0,0,0,0.2);
  }
  button#refreshBtn:hover{opacity:0.92;}
  button#refreshBtn .spin{display:inline-block; transition:transform 0.5s;}
  button#refreshBtn.loading .spin{animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  nav.sectionNav{
    position:sticky; top:0; z-index:35;
    display:flex; gap:6px; overflow-x:auto; padding:10px clamp(16px,4vw,40px);
    background:var(--header-bg); border-bottom:1px solid rgba(255,255,255,0.08);
    -webkit-overflow-scrolling:touch; scrollbar-width:thin;
  }
  nav.sectionNav::-webkit-scrollbar{height:4px;}
  nav.sectionNav a{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:7px;
    color:rgba(255,255,255,0.8); text-decoration:none; font-size:0.82rem; font-weight:600;
    padding:7px 13px; border-radius:20px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.08); white-space:nowrap; transition:background 0.15s, color 0.15s;
  }
  nav.sectionNav a .ic{font-size:0.95rem; line-height:1;}
  nav.sectionNav a:hover{background:rgba(255,255,255,0.14); color:#fff;}
  nav.sectionNav a.active{background:#fff; color:var(--accent-dark);}
  nav.sectionNav a .n{background:rgba(255,255,255,0.18); border-radius:10px; padding:1px 7px; font-size:0.75rem;}
  nav.sectionNav a.active .n{background:var(--accent-soft); color:var(--accent-dark);}

  main{padding:22px clamp(16px,4vw,40px) 40px; width:100%; margin:0; max-width:none;}

  .summary{display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; margin-bottom:24px;}
  .summary .card{
    background:var(--card); border:1px solid var(--border); border-left:4px solid var(--bad);
    border-radius:12px; padding:16px 18px; cursor:pointer; transition:transform 0.15s, box-shadow 0.15s;
  }
  .summary .card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(10,30,25,0.1);}
  .summary .card.zero-border{border-left-color:var(--good);}
  .summary .card .num{font-size:2rem; font-weight:800; color:var(--bad); line-height:1;}
  .summary .card .num.zero{color:var(--good);}
  .summary .card .label{font-size:0.82rem; color:var(--muted); margin-top:6px; font-weight:600;}

  section.panel{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    margin-bottom:22px; overflow:hidden; scroll-margin-top:120px;
    box-shadow:0 1px 3px rgba(10,30,25,0.05);
  }
  section.panel .panel-header{
    padding:15px 20px; background:var(--accent-soft); color:var(--text);
    font-weight:700; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; flex-wrap:wrap; gap:10px; border-bottom:1px solid var(--border);
  }
  section.panel .panel-header .title-wrap{display:flex; align-items:center; gap:10px; min-width:0;}
  section.panel .panel-header .title-wrap .ic{
    font-size:1.1rem; flex:0 0 auto; width:34px; height:34px; display:flex; align-items:center;
    justify-content:center; background:var(--card); border-radius:9px; border:1px solid var(--border);
  }
  section.panel .panel-header .title-text{overflow-wrap:anywhere;}
  section.panel .panel-header .count{
    font-weight:700; background:var(--accent); color:#fff; padding:3px 12px; border-radius:14px; font-size:0.82rem;
    flex:0 0 auto;
  }
  section.panel .panel-header .count.zero{background:var(--good);}
  section.panel .panel-header .chev{transition:transform 0.2s; opacity:0.6; flex:0 0 auto;}
  section.panel.collapsed .panel-header .chev{transform:rotate(-90deg);}

  /* ---- filter bar ---- */
  .filter-bar{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding:12px 20px; background:var(--card-alt); border-bottom:1px solid var(--border);
  }
  .filter-bar .fgroup{display:flex; flex-direction:column; gap:3px;}
  .filter-bar label{font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em; color:var(--muted);}
  .filter-bar select{
    font-size:0.82rem; padding:6px 9px; border-radius:7px; border:1px solid var(--border);
    background:var(--card); color:var(--text); min-width:140px; max-width:220px;
  }
  .filter-bar .spacer{flex:1 1 auto;}
  .filter-bar .btn-reset, .filter-bar .btn-download{
    font-size:0.8rem; font-weight:700; padding:7px 14px; border-radius:7px; border:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px;
  }
  .filter-bar .btn-reset{background:transparent; color:var(--muted); border:1px solid var(--border);}
  .filter-bar .btn-reset:hover{background:var(--border);}
  .filter-bar .btn-download{background:var(--accent); color:#fff;}
  .filter-bar .btn-download:hover{background:var(--accent-dark);}
  .filter-bar .btn-download:disabled{opacity:0.45; cursor:not-allowed;}

  /* ---- top mirrored horizontal scrollbar ---- */
  .scroll-track{
    overflow-x:auto; overflow-y:hidden; height:14px;
    border-bottom:1px solid var(--border); background:var(--card-alt);
  }
  .scroll-track-inner{height:1px;}
  .scroll-track::-webkit-scrollbar{height:10px;}
  .scroll-track::-webkit-scrollbar-thumb{background:var(--border); border-radius:6px;}

  /* ---- per-section frozen-pane table frame ---- */
  .table-frame{
    max-height:58vh; overflow:auto; -webkit-overflow-scrolling:touch; position:relative;
    isolation:isolate;
  }
  table{border-collapse:separate; border-spacing:0; width:100%; font-size:0.84rem; min-width:max-content;}
  th, td{padding:9px 12px; border-bottom:1px solid var(--border); white-space:nowrap; text-align:left;}
  th{
    background:var(--accent-dark); color:#fff; position:sticky; top:0; z-index:3; font-weight:600;
    text-transform:uppercase; font-size:0.7rem; letter-spacing:0.03em;
    background-clip:padding-box;
  }
  th:first-child, td:first-child{
    position:sticky; left:0; z-index:2;
    box-shadow:2px 0 4px -2px rgba(0,0,0,0.18);
    background-clip:padding-box;
    contain:paint;
  }
  th:first-child{ z-index:4; background:var(--accent-dark); }
  td:first-child{ background:var(--card); font-weight:600; color:var(--text); }
  tbody tr:nth-child(even) td{ background:var(--card-alt); }
  tbody tr:nth-child(even) td:first-child{ background:var(--card-alt); }
  tbody tr:nth-child(odd) td:first-child{ background:var(--card); }
  tbody tr:hover td{background:var(--accent-soft);}
  tbody tr:hover td:first-child{background:var(--accent-soft);}
  tbody tr.hiddenRow{display:none;}

  .empty-msg{padding:20px; color:var(--good); font-weight:700; display:flex; align-items:center; gap:8px;}
  .loading, .error-msg{padding:40px; text-align:center; color:var(--muted);}
  .error-msg{color:var(--bad); white-space:pre-line; text-align:left; line-height:1.6;}
  .note{padding:10px 20px 16px; font-size:0.78rem; color:var(--muted); border-top:1px dashed var(--border);}

  footer{text-align:center; padding:22px; color:var(--muted); font-size:0.78rem;}

  @media (max-width:640px){
    nav.sectionNav a span.label-text{display:none;}
    .table-frame{max-height:50vh;}
  }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-top">
    <div>
      <h1>🌿 EmpowerHer — Data Quality Dashboard</h1>
      <div class="meta" id="generatedAt">Loading…</div>
    </div>
    <button id="refreshBtn" onclick="loadAll()"><span class="spin">⟳</span> Refresh</button>
  </div>
</header>

<nav class="sectionNav" id="sectionNav"></nav>

<main>
  <div class="summary" id="summaryCards"></div>
  <div id="sections"></div>
  <div id="status"></div>
</main>

<footer>
  Reads live from the linked Google Sheet's public CSV export. No data is stored on GitHub, no deployment needed.
</footer>

<script>
// ===== CONFIGURE THIS LINE ONLY =====
const SHEET_ID = "1ETUSd0DlatPcraorNA0541yV3C-LmvtpCMea5gGP-KY";
// =====================================

// expectColumn: a column name (substring match, case-insensitive) that MUST
// appear in the fetched tab's own header row. If it's missing, the CSV
// endpoint most likely silently fell back to the workbook's first tab
// (often "Sheet1" / raw import) instead of the named tab — this catches
// that instead of silently showing the wrong sheet's data.
const SECTIONS_CONFIG = [
  { id: "duplicates",        icon: "🧾", title: "Duplicate Data (full-row matches)",                         sheet: "DUPLICATE DATA_FLAT",  expectColumn: "duplicate" },
  { id: "fatherHusbandName", icon: "👨", title: "Husband / Father Name — Blank, Single Letter, or Numeric", sheet: "ERR_FATHER_NAME",      expectColumn: "father" },
  { id: "lowFamilyIncome",   icon: "💵", title: "Family Monthly Income Below ₹2000",                          sheet: "ERR_FAMILY_INCOME",    expectColumn: "family" },
  { id: "lowPersonalIncome", icon: "👩‍👧", title: "Personal Occupation (Homemaker-type) with Low/Missing Income", sheet: "ERR_PERSONAL_INCOME",  expectColumn: "personal" },
  { id: "enterpriseUnknown", icon: "🏬", title: 'Existing Enterprise = "???"',                                sheet: "ERR_ENTERPRISE",       expectColumn: "enterprise" }
];

// location columns every section is filterable by (header match is
// case-insensitive "includes"); order here = cascading hierarchy order
const FILTER_DIMS = [
  { key: "state",     label: "State",          match: "state" },
  { key: "district",  label: "District",       match: "district" },
  { key: "block",     label: "Block",          match: "block" },
  { key: "gram",      label: "Gram Panchayat", match: "gram panchayat" }
];

const EMPTY_STATE_PATTERNS = [/no\s+duplicate/i, /no\s+issues?/i, /no\s+errors?/i, /no\s+records?\s+found/i];

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return str.toString()
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function parseCSV(text) {
  var rows = [], row = [], cur = "", q = false, i = 0, c;
  text = text.replace(/^\uFEFF/, "");
  for (; i < text.length; i++) {
    c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cur); cur = ""; rows.push(row); row = [];
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ""; }); });
}

function csvUrl(sheetName) {
  return "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
    "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(sheetName) + "&t=" + Date.now();
}

function viaFetch(sheetName) {
  return fetch(csvUrl(sheetName), { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function (t) {
    if (/^\s*<(!doctype|html)/i.test(t)) throw new Error("Sheet is not shared publicly (or tab name doesn't exist yet)");
    return parseCSV(t);
  });
}

function viaJsonp(sheetName) {
  return new Promise(function (res, rej) {
    var cb = "gv_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    var s = document.createElement("script");
    var to = setTimeout(function () { cl(); rej(new Error("timeout")); }, 15000);
    function cl() { clearTimeout(to); delete window[cb]; s.remove(); }
    window[cb] = function (j) {
      cl();
      if (!j || j.status !== "ok" || !j.table) return rej(new Error("Sheet not shared publicly (or tab name doesn't exist yet)"));
      var cols = j.table.cols.map(function (c) { return c.label || c.id; });
      res([cols].concat(j.table.rows.map(function (r) {
        return (r.c || []).map(function (c) { return c ? (c.f != null && c.f !== "" ? c.f : (c.v == null ? "" : c.v)) : ""; });
      })));
    };
    s.onerror = function () { cl(); rej(new Error("blocked")); };
    s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
      "/gviz/tq?tqx=out:json;responseHandler:" + cb + "&sheet=" + encodeURIComponent(sheetName) + "&headers=1";
    document.head.appendChild(s);
  });
}

function loadSheet(sheetName) {
  return viaFetch(sheetName).catch(function () { return viaJsonp(sheetName); });
}

function isEmptyStateTable(table) {
  if (table.length === 1 && table[0].length <= 2) {
    var text = table[0].join(" ").trim();
    return EMPTY_STATE_PATTERNS.some(function (re) { return re.test(text); });
  }
  return false;
}

async function loadAll() {
  const statusEl = document.getElementById("status");
  const genEl = document.getElementById("generatedAt");
  const btn = document.getElementById("refreshBtn");
  btn.classList.add("loading");
  statusEl.innerHTML = '<div class="loading">Loading latest data…</div>';
  genEl.textContent = "Loading…";

  const results = [];
  for (const cfg of SECTIONS_CONFIG) {
    try {
      const table = await loadSheet(cfg.sheet);

      if (table.length === 0 || isEmptyStateTable(table)) {
        results.push({ id: cfg.id, icon: cfg.icon, title: cfg.title, columns: [], rows: [], error: null, explicitEmpty: true });
        continue;
      }

      const headers = table[0];

      // tab-mismatch safeguard: confirm this really is the expected tab
      if (cfg.expectColumn) {
        const hasExpected = headers.some(h => String(h).toLowerCase().includes(cfg.expectColumn));
        if (!hasExpected) {
          results.push({
            id: cfg.id, icon: cfg.icon, title: cfg.title, columns: [], rows: [], explicitEmpty: false,
            error: 'This came back without a "' + cfg.expectColumn + '"-type column, so the tab named "' + cfg.sheet +
              '" probably doesn\'t exist right now (or its name doesn\'t match exactly) and Google served the workbook\'s ' +
              'first tab instead. Check the tab name in the Sheet, then Refresh.'
          });
          continue;
        }
      }

      let rows = table.slice(1);

      if (cfg.id === "duplicates") {
        let last = "";
        rows = rows.map(r => {
          const copy = r.slice();
          if (String(copy[0]).trim() === "") copy[0] = last; else last = copy[0];
          return copy;
        });
      }

      results.push({ id: cfg.id, icon: cfg.icon, title: cfg.title, columns: headers, rows: rows, error: null, explicitEmpty: false });
    } catch (err) {
      results.push({ id: cfg.id, icon: cfg.icon, title: cfg.title, columns: [], rows: [], error: err.message, explicitEmpty: false });
    }
  }

  statusEl.innerHTML = "";
  genEl.textContent = "Last loaded: " + new Date().toLocaleString();
  btn.classList.remove("loading");
  render(results);
}

function buildNav(sections) {
  const nav = document.getElementById("sectionNav");
  nav.innerHTML = sections.map(sec => {
    const count = sec.error ? "–" : sec.rows.length;
    return '<a href="#panel-' + sec.id + '" data-target="panel-' + sec.id + '">' +
      '<span class="ic">' + sec.icon + '</span>' +
      '<span class="label-text">' + escapeHtml(sec.title.split(" (")[0].split(" —")[0]) + '</span>' +
      '<span class="n">' + count + '</span>' +
      '</a>';
  }).join("");

  nav.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", () => {
      nav.querySelectorAll("a").forEach(x => x.classList.remove("active"));
      a.classList.add("active");
    });
  });
}

function wireTopScrollbar(track, trackInner, frame, table) {
  trackInner.style.width = table.scrollWidth + "px";
  let syncing = false;
  track.addEventListener("scroll", () => {
    if (syncing) return; syncing = true;
    frame.scrollLeft = track.scrollLeft;
    syncing = false;
  });
  frame.addEventListener("scroll", () => {
    if (syncing) return; syncing = true;
    track.scrollLeft = frame.scrollLeft;
    syncing = false;
  });
  window.addEventListener("resize", () => { trackInner.style.width = table.scrollWidth + "px"; });
}

function csvEscape(v) {
  const s = v === null || v === undefined ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadCSV(filename, headers, rows) {
  const lines = [headers.map(csvEscape).join(",")].concat(rows.map(r => r.map(csvEscape).join(",")));
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

// builds the filter bar for one section and wires up cascading + CSV export
function buildFilterBar(sec, headers, rows, trEls, panel, countBadge) {
  const colIdx = {};
  FILTER_DIMS.forEach(d => {
    colIdx[d.key] = headers.findIndex(h => String(h).toLowerCase().includes(d.match));
  });
  const activeDims = FILTER_DIMS.filter(d => colIdx[d.key] !== -1);
  if (activeDims.length === 0) return null;

  const filters = {}; activeDims.forEach(d => filters[d.key] = "");

  const bar = document.createElement("div");
  bar.className = "filter-bar";

  const selects = {};
  activeDims.forEach(d => {
    const group = document.createElement("div");
    group.className = "fgroup";
    const label = document.createElement("label");
    label.textContent = d.label;
    const select = document.createElement("select");
    select.dataset.dim = d.key;
    group.appendChild(label);
    group.appendChild(select);
    bar.appendChild(group);
    selects[d.key] = select;
  });

  const spacer = document.createElement("div");
  spacer.className = "spacer";
  bar.appendChild(spacer);

  const resetBtn = document.createElement("button");
  resetBtn.className = "btn-reset";
  resetBtn.textContent = "Reset filters";
  bar.appendChild(resetBtn);

  const dlBtn = document.createElement("button");
  dlBtn.className = "btn-download";
  dlBtn.innerHTML = "⬇ Download CSV";
  bar.appendChild(dlBtn);

  function rowMatches(row, excludeDim) {
    return activeDims.every(d => {
      if (d.key === excludeDim) return true;
      if (!filters[d.key]) return true;
      return String(row[colIdx[d.key]]).trim() === filters[d.key];
    });
  }

  function refreshOptions() {
    activeDims.forEach(d => {
      const current = filters[d.key];
      const opts = Array.from(new Set(
        rows.filter(r => rowMatches(r, d.key)).map(r => String(r[colIdx[d.key]]).trim()).filter(Boolean)
      )).sort((a, b) => a.localeCompare(b));

      const select = selects[d.key];
      const keep = opts.includes(current) ? current : "";
      if (keep !== current) filters[d.key] = keep;
      select.innerHTML = '<option value="">All ' + d.label + '</option>' +
        opts.map(o => '<option value="' + escapeHtml(o) + '"' + (o === keep ? " selected" : "") + '>' + escapeHtml(o) + "</option>").join("");
    });
  }

  function applyFilters() {
    let visibleCount = 0;
    rows.forEach((r, i) => {
      const show = rowMatches(r, null);
      trEls[i].classList.toggle("hiddenRow", !show);
      if (show) visibleCount++;
    });
    countBadge.textContent = visibleCount + " row(s)" + (visibleCount !== rows.length ? " (of " + rows.length + ")" : "");
    dlBtn.disabled = visibleCount === 0;
    return visibleCount;
  }

  Object.keys(selects).forEach(key => {
    selects[key].addEventListener("change", () => {
      filters[key] = selects[key].value;
      refreshOptions();
      applyFilters();
    });
  });

  resetBtn.addEventListener("click", () => {
    activeDims.forEach(d => filters[d.key] = "");
    refreshOptions();
    applyFilters();
  });

  dlBtn.addEventListener("click", () => {
    const visibleRows = rows.filter((r) => rowMatches(r, null));
    const namePart = activeDims
      .filter(d => filters[d.key])
      .map(d => filters[d.key].replace(/[^a-z0-9]+/gi, "_"))
      .join("_");
    const filename = sec.id + (namePart ? "_" + namePart : "_all") + ".csv";
    downloadCSV(filename, headers, visibleRows);
  });

  refreshOptions();
  applyFilters();

  return bar;
}

function render(sections) {
  const summaryEl = document.getElementById("summaryCards");
  const sectionsEl = document.getElementById("sections");
  summaryEl.innerHTML = "";
  sectionsEl.innerHTML = "";

  buildNav(sections);

  const anyFatalError = sections.every(s => s.error);
  if (anyFatalError) {
    document.getElementById("status").innerHTML =
      '<div class="error-msg">⚠️ Could not read the Google Sheet.\n\n' +
      '1) In the Sheet, click Share → General access → set to "Anyone with the link" (Viewer).\n' +
      '2) Make sure tab names in the Sheet exactly match: DUPLICATE DATA_FLAT, ERR_FATHER_NAME, ERR_FAMILY_INCOME, ERR_PERSONAL_INCOME, ERR_ENTERPRISE.\n' +
      '3) Run generateDuplicateReport() and generateErrorReport() at least once so these tabs exist.</div>';
  }

  sections.forEach(sec => {
    const count = sec.error ? null : sec.rows.length;
    const isZero = sec.explicitEmpty || count === 0;

    const card = document.createElement("div");
    card.className = "card" + (isZero ? " zero-border" : "");
    card.onclick = () => document.getElementById("panel-" + sec.id).scrollIntoView({ behavior: "smooth", block: "start" });
    if (sec.error) {
      card.innerHTML = '<div class="num zero">?</div><div class="label">' + sec.icon + ' ' + escapeHtml(sec.title) + ' (could not load)</div>';
    } else {
      card.innerHTML = '<div class="num ' + (isZero ? "zero" : "") + '">' + (isZero ? 0 : count) + '</div>' +
        '<div class="label">' + sec.icon + ' ' + escapeHtml(sec.title) + '</div>';
    }
    summaryEl.appendChild(card);

    const panel = document.createElement("section");
    panel.className = "panel";
    panel.id = "panel-" + sec.id;

    const header = document.createElement("div");
    header.className = "panel-header";
    const countLabel = sec.error ? "error" : (isZero ? "0 row(s)" : count + " row(s)");
    header.innerHTML =
      '<div class="title-wrap"><span class="ic">' + sec.icon + '</span><span class="title-text">' + escapeHtml(sec.title) + '</span></div>' +
      '<span class="count' + (sec.error ? "" : isZero ? " zero" : "") + '">' + countLabel + '</span>' +
      '<span class="chev">▾</span>';

    panel.appendChild(header);
    const countBadge = header.querySelector(".count");

    if (sec.error) {
      const body = document.createElement("div");
      body.innerHTML = '<div class="error-msg">' + escapeHtml(sec.error) + '</div>';
      panel.appendChild(body);
    } else if (isZero) {
      const body = document.createElement("div");
      body.innerHTML = '<div class="empty-msg">✅ No issues found in this category.</div>';
      panel.appendChild(body);
    } else {
      const trEls = [];

      const frame = document.createElement("div");
      frame.className = "table-frame";

      const tableEl = document.createElement("table");
      const thead = document.createElement("thead");
      const headTr = document.createElement("tr");
      sec.columns.forEach(c => {
        const th = document.createElement("th");
        th.textContent = c;
        headTr.appendChild(th);
      });
      thead.appendChild(headTr);
      const tbody = document.createElement("tbody");
      sec.rows.forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
        trEls.push(tr);
      });
      tableEl.appendChild(thead);
      tableEl.appendChild(tbody);
      frame.appendChild(tableEl);

      const filterBar = buildFilterBar(sec, sec.columns, sec.rows, trEls, panel, countBadge);
      if (filterBar) panel.appendChild(filterBar);

      const track = document.createElement("div");
      track.className = "scroll-track";
      const trackInner = document.createElement("div");
      trackInner.className = "scroll-track-inner";
      track.appendChild(trackInner);

      panel.appendChild(track);
      panel.appendChild(frame);

      requestAnimationFrame(() => wireTopScrollbar(track, trackInner, frame, tableEl));
    }

    header.addEventListener("click", () => {
      const filterBarEl = panel.querySelector(".filter-bar");
      const scrollTrack = panel.querySelector(".scroll-track");
      const frameEl = panel.querySelector(".table-frame");
      const simpleBody = panel.querySelector(".empty-msg, .error-msg");
      const nowHidden = panel.classList.toggle("collapsed");
      if (filterBarEl) filterBarEl.style.display = nowHidden ? "none" : "flex";
      if (scrollTrack) scrollTrack.style.display = nowHidden ? "none" : "block";
      if (frameEl) frameEl.style.display = nowHidden ? "none" : "block";
      if (simpleBody) simpleBody.style.display = nowHidden ? "none" : "flex";
    });

    if (sec.id === "duplicates" && !sec.error) {
      const note = document.createElement("div");
      note.className = "note";
      note.textContent = "This list is exact full-row repeats only — when one row matches another, every row in that matching group is shown (not just one), grouped under a Duplicate Series No, so you can see all copies and decide which to keep.";
      panel.appendChild(note);
    }

    sectionsEl.appendChild(panel);
  });

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const link = document.querySelector('nav.sectionNav a[data-target="' + e.target.id + '"]');
      if (!link) return;
      if (e.isIntersecting) {
        document.querySelectorAll("nav.sectionNav a").forEach(a => a.classList.remove("active"));
        link.classList.add("active");
      }
    });
  }, { rootMargin: "-120px 0px -70% 0px" });
  document.querySelectorAll("section.panel").forEach(p => io.observe(p));
}

loadAll();
</script>

</body>
