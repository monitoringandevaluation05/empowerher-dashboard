<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EmpowerHer — Data Quality Dashboard</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --text:#202124; --muted:#5f6368;
    --accent:#1a73e8; --warn:#fbbc04; --bad:#d93025; --good:#188038;
    --border:#e3e6ea;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161a; --card:#1e2127; --text:#e8eaed; --muted:#9aa0a6;
      --accent:#8ab4f8; --warn:#fdd663; --bad:#f28b82; --good:#81c995;
      --border:#33363d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161a; --card:#1e2127; --text:#e8eaed; --muted:#9aa0a6;
    --accent:#8ab4f8; --warn:#fdd663; --bad:#f28b82; --good:#81c995;
    --border:#33363d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    padding:20px 24px; background:var(--accent); color:#fff;
    display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
  }
  header h1{margin:0; font-size:1.25rem;}
  header .meta{font-size:0.85rem; opacity:0.9;}
  button{
    background:#fff; color:var(--accent); border:none; border-radius:6px;
    padding:8px 14px; font-weight:600; cursor:pointer; font-size:0.85rem;
  }
  button:hover{opacity:0.9;}
  main{padding:20px; max-width:1200px; margin:0 auto;}
  .summary{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:20px;}
  .summary .card{
    flex:1 1 180px; background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:16px; text-align:center;
  }
  .summary .card .num{font-size:1.8rem; font-weight:700; color:var(--bad);}
  .summary .card .num.zero{color:var(--good);}
  .summary .card .label{font-size:0.85rem; color:var(--muted); margin-top:4px;}
  section.panel{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    margin-bottom:20px; overflow:hidden;
  }
  section.panel .panel-header{
    padding:14px 18px; background:var(--warn); color:#202124;
    font-weight:700; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; flex-wrap:wrap; gap:8px;
  }
  section.panel .panel-header .count{font-weight:700; background:rgba(0,0,0,0.15); padding:2px 10px; border-radius:12px; font-size:0.85rem;}
  .table-wrap{overflow-x:auto;}
  table{border-collapse:collapse; width:100%; font-size:0.85rem;}
  th, td{padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; text-align:left;}
  th{background:var(--accent); color:#fff; position:sticky; top:0;}
  tbody tr:nth-child(even){background:rgba(128,128,128,0.06);}
  .empty-msg{padding:16px 18px; color:var(--good); font-weight:600;}
  .loading, .error-msg{padding:40px; text-align:center; color:var(--muted);}
  .error-msg{color:var(--bad); white-space:pre-line;}
  footer{text-align:center; padding:20px; color:var(--muted); font-size:0.8rem;}
</style>
</head>
<body>

<header>
  <div>
    <h1>EmpowerHer — Data Quality Dashboard</h1>
    <div class="meta" id="generatedAt">Loading…</div>
  </div>
  <div>
    <button onclick="loadAll()">Refresh</button>
  </div>
</header>

<main>
  <div class="summary" id="summaryCards"></div>
  <div id="sections"></div>
  <div id="status"></div>
</main>

<footer>
  Reads live from the linked Google Sheet's public CSV export. No data is stored on GitHub, no deployment needed.
</footer>

<script>
// ===== CONFIGURE THESE TWO LINES ONLY =====
const SHEET_ID = "1ETUSd0DlatPcraorNA0541yV3C-LmvtpCMea5gGP-KY";
// ===========================================

const SECTIONS_CONFIG = [
  { id: "duplicates",        title: "Duplicate Data (full-row matches)",                         sheet: "DUPLICATE DATA_FLAT" },
  { id: "fatherHusbandName", title: "Husband / Father Name — Missing, Blank, Single Word, or Numeric Only", sheet: "ERR_FATHER_NAME" },
  { id: "lowFamilyIncome",   title: "Family Monthly Income Below ₹2000",                          sheet: "ERR_FAMILY_INCOME" },
  { id: "lowPersonalIncome", title: "Personal Occupation (Homemaker-type) with Low/Missing Personal Income", sheet: "ERR_PERSONAL_INCOME" },
  { id: "enterpriseUnknown", title: 'Existing Enterprise = "???"',                                sheet: "ERR_ENTERPRISE" }
];

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return str.toString()
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// ---------- CSV parsing (same approach as the working dashboard) ----------
function parseCSV(text) {
  var rows = [], row = [], cur = "", q = false, i = 0, c;
  text = text.replace(/^\uFEFF/, "");
  for (; i < text.length; i++) {
    c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cur); cur = ""; rows.push(row); row = [];
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ""; }); });
}

function csvUrl(sheetName) {
  return "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
    "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(sheetName) + "&t=" + Date.now();
}

function viaFetch(sheetName) {
  return fetch(csvUrl(sheetName), { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function (t) {
    if (/^\s*<(!doctype|html)/i.test(t)) throw new Error("Sheet is not shared publicly (or tab name doesn't exist yet)");
    return parseCSV(t);
  });
}

function viaJsonp(sheetName) {
  return new Promise(function (res, rej) {
    var cb = "gv_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    var s = document.createElement("script");
    var to = setTimeout(function () { cl(); rej(new Error("timeout")); }, 15000);
    function cl() { clearTimeout(to); delete window[cb]; s.remove(); }
    window[cb] = function (j) {
      cl();
      if (!j || j.status !== "ok" || !j.table) return rej(new Error("Sheet not shared publicly (or tab name doesn't exist yet)"));
      var cols = j.table.cols.map(function (c) { return c.label || c.id; });
      res([cols].concat(j.table.rows.map(function (r) {
        return (r.c || []).map(function (c) { return c ? (c.f != null && c.f !== "" ? c.f : (c.v == null ? "" : c.v)) : ""; });
      })));
    };
    s.onerror = function () { cl(); rej(new Error("blocked")); };
    s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
      "/gviz/tq?tqx=out:json;responseHandler:" + cb + "&sheet=" + encodeURIComponent(sheetName) + "&headers=1";
    document.head.appendChild(s);
  });
}

function loadSheet(sheetName) {
  return viaFetch(sheetName).catch(function () { return viaJsonp(sheetName); });
}

async function loadAll() {
  const statusEl = document.getElementById("status");
  const genEl = document.getElementById("generatedAt");
  statusEl.innerHTML = '<div class="loading">Loading latest data…</div>';
  genEl.textContent = "Loading…";

  const results = [];
  for (const cfg of SECTIONS_CONFIG) {
    try {
      const table = await loadSheet(cfg.sheet);
      const headers = table.length ? table[0] : [];
      let rows = table.slice(1);

      // The flattened duplicate-series column can repeat blanks in merged
      // exports; forward-fill the first column just in case.
      if (cfg.id === "duplicates") {
        let last = "";
        rows = rows.map(r => {
          const copy = r.slice();
          if (String(copy[0]).trim() === "") copy[0] = last; else last = copy[0];
          return copy;
        });
      }

      results.push({ id: cfg.id, title: cfg.title, columns: headers, rows: rows, error: null });
    } catch (err) {
      results.push({ id: cfg.id, title: cfg.title, columns: [], rows: [], error: err.message });
    }
  }

  statusEl.innerHTML = "";
  genEl.textContent = "Last loaded: " + new Date().toLocaleString();
  render(results);
}

function render(sections) {
  const summaryEl = document.getElementById("summaryCards");
  const sectionsEl = document.getElementById("sections");
  summaryEl.innerHTML = "";
  sectionsEl.innerHTML = "";

  const anyFatalError = sections.every(s => s.error);
  if (anyFatalError) {
    document.getElementById("status").innerHTML =
      '<div class="error-msg">Could not read the Google Sheet.\n\n' +
      '1) In the Sheet, click Share → General access → set to "Anyone with the link" (Viewer).\n' +
      '2) Make sure tab names in the Sheet exactly match: DUPLICATE DATA_FLAT, ERR_FATHER_NAME, ERR_FAMILY_INCOME, ERR_PERSONAL_INCOME, ERR_ENTERPRISE.\n' +
      '3) Run generateDuplicateReport() and generateErrorReport() at least once so these tabs exist.</div>';
  }

  sections.forEach(sec => {
    const count = sec.rows.length;

    const card = document.createElement("div");
    card.className = "card";
    if (sec.error) {
      card.innerHTML = '<div class="num zero">?</div><div class="label">' + escapeHtml(sec.title) + ' (could not load)</div>';
    } else {
      card.innerHTML = '<div class="num ' + (count === 0 ? "zero" : "") + '">' + count + '</div>' +
        '<div class="label">' + escapeHtml(sec.title) + '</div>';
    }
    summaryEl.appendChild(card);

    const panel = document.createElement("section");
    panel.className = "panel";

    const header = document.createElement("div");
    header.className = "panel-header";
    const countLabel = sec.error ? "error" : (count + " row(s)");
    header.innerHTML = '<span>' + escapeHtml(sec.title) + '</span><span class="count">' + countLabel + '</span>';

    const body = document.createElement("div");
    body.className = "table-wrap";
    body.style.display = "block";

    if (sec.error) {
      body.innerHTML = '<div class="error-msg">' + escapeHtml(sec.error) + '</div>';
    } else if (count === 0) {
      body.innerHTML = '<div class="empty-msg">✅ No issues found in this category.</div>';
    } else {
      let html = "<table><thead><tr>";
      sec.columns.forEach(c => html += "<th>" + escapeHtml(c) + "</th>");
      html += "</tr></thead><tbody>";
      sec.rows.forEach(row => {
        html += "<tr>";
        row.forEach(cell => html += "<td>" + escapeHtml(cell) + "</td>");
        html += "</tr>";
      });
      html += "</tbody></table>";
      body.innerHTML = html;
    }

    header.addEventListener("click", () => {
      body.style.display = body.style.display === "none" ? "block" : "none";
    });

    panel.appendChild(header);
    panel.appendChild(body);
    sectionsEl.appendChild(panel);
  });
}

loadAll();
</script>

</body>
</html>
