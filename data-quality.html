<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EmpowerHer — Data Quality Dashboard</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#ffffff; --text:#202124; --muted:#5f6368;
    --accent:#1a73e8; --warn:#fbbc04; --bad:#d93025; --good:#188038;
    --border:#e3e6ea;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161a; --card:#1e2127; --text:#e8eaed; --muted:#9aa0a6;
      --accent:#8ab4f8; --warn:#fdd663; --bad:#f28b82; --good:#81c995;
      --border:#33363d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161a; --card:#1e2127; --text:#e8eaed; --muted:#9aa0a6;
    --accent:#8ab4f8; --warn:#fdd663; --bad:#f28b82; --good:#81c995;
    --border:#33363d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  header{
    padding:20px 24px; background:var(--accent); color:#fff;
    display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
  }
  header h1{margin:0; font-size:1.25rem;}
  header .meta{font-size:0.85rem; opacity:0.9;}
  .controls{display:flex; gap:10px; align-items:center;}
  #configUrl{padding:8px 10px; border-radius:6px; border:none; width:280px; max-width:50vw; font-size:0.85rem;}
  button{
    background:#fff; color:var(--accent); border:none; border-radius:6px;
    padding:8px 14px; font-weight:600; cursor:pointer; font-size:0.85rem;
  }
  button:hover{opacity:0.9;}
  main{padding:20px; max-width:1200px; margin:0 auto;}
  .summary{display:flex; flex-wrap:wrap; gap:14px; margin-bottom:20px;}
  .summary .card{
    flex:1 1 180px; background:var(--card); border:1px solid var(--border);
    border-radius:10px; padding:16px; text-align:center;
  }
  .summary .card .num{font-size:1.8rem; font-weight:700; color:var(--bad);}
  .summary .card .num.zero{color:var(--good);}
  .summary .card .label{font-size:0.85rem; color:var(--muted); margin-top:4px;}
  section.panel{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    margin-bottom:20px; overflow:hidden;
  }
  section.panel .panel-header{
    padding:14px 18px; background:var(--warn); color:#202124;
    font-weight:700; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; flex-wrap:wrap; gap:8px;
  }
  section.panel .panel-header .count{font-weight:700; background:rgba(0,0,0,0.15); padding:2px 10px; border-radius:12px; font-size:0.85rem;}
  .table-wrap{overflow-x:auto;}
  table{border-collapse:collapse; width:100%; font-size:0.85rem;}
  th, td{padding:8px 10px; border-bottom:1px solid var(--border); white-space:nowrap; text-align:left;}
  th{background:var(--accent); color:#fff; position:sticky; top:0;}
  tbody tr:nth-child(even){background:rgba(128,128,128,0.06);}
  .empty-msg{padding:16px 18px; color:var(--good); font-weight:600;}
  .loading, .error-msg{padding:40px; text-align:center; color:var(--muted);}
  .error-msg{color:var(--bad);}
  footer{text-align:center; padding:20px; color:var(--muted); font-size:0.8rem;}
</style>
</head>
<body>

<header>
  <div>
    <h1>EmpowerHer — Data Quality Dashboard</h1>
    <div class="meta" id="generatedAt">Not loaded yet</div>
  </div>
  <div class="controls">
    <input id="configUrl" type="text" placeholder="Paste your Apps Script Web App URL here">
    <button onclick="saveUrlAndLoad()">Load</button>
    <button onclick="loadData()">Refresh</button>
  </div>
</header>

<main>
  <div class="summary" id="summaryCards"></div>
  <div id="sections"></div>
  <div id="status"></div>
</main>

<footer>
  Reads live from the linked Google Sheet via an Apps Script Web App endpoint. No data is stored on GitHub.
</footer>

<script>
// Paste the /exec URL you get after deploying DuplicateAndErrorReport.gs as a Web App.
// Example: https://script.google.com/macros/s/AKfycbxxxxxxxxxxxxxxxxxxxx/exec
const DEFAULT_WEB_APP_URL = "";

function getWebAppUrl() {
  try {
    return localStorage.getItem("empowerher_webapp_url") || DEFAULT_WEB_APP_URL;
  } catch (e) {
    return DEFAULT_WEB_APP_URL;
  }
}

function saveUrlAndLoad() {
  const val = document.getElementById("configUrl").value.trim();
  if (val) {
    try { localStorage.setItem("empowerher_webapp_url", val); } catch (e) {}
  }
  loadData();
}

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return str.toString()
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

async function loadData() {
  const statusEl = document.getElementById("status");
  const url = getWebAppUrl();
  document.getElementById("configUrl").value = url || "";

  if (!url) {
    statusEl.innerHTML = '<div class="error-msg">Paste your Apps Script Web App URL above and click Load.</div>';
    return;
  }

  statusEl.innerHTML = '<div class="loading">Loading latest data…</div>';

  // Google's Apps Script Web App responses get blocked by the browser's
  // CORB/CORS protections when loaded directly from a different website
  // (GitHub Pages). We route the request through a public CORS relay
  // (allorigins.win) which re-serves the same response with the headers
  // browsers require to allow it through. No Apps Script changes needed —
  // this only changes how the browser fetches the already-working URL.
  const proxiedUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);

  try {
    const res = await fetchWithTimeout(proxiedUrl, 25000);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    statusEl.innerHTML = "";
    render(data);
  } catch (err) {
    statusEl.innerHTML = '<div class="error-msg">Could not load data: ' + escapeHtml(err.message) +
      '. Double-check the Web App URL is correct and ends in /exec, and that deployment access is "Anyone with the link".</div>';
  }
}

function fetchWithTimeout(resource, timeoutMs) {
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeoutMs);
  return fetch(resource, { signal: controller.signal }).finally(() => clearTimeout(id));
}

function render(data) {
  const genEl = document.getElementById("generatedAt");
  genEl.textContent = data.generatedAt
    ? "Last generated: " + new Date(data.generatedAt).toLocaleString()
    : "No generation timestamp available";

  const summaryEl = document.getElementById("summaryCards");
  const sectionsEl = document.getElementById("sections");
  summaryEl.innerHTML = "";
  sectionsEl.innerHTML = "";

  const sections = (data.sections || []);

  sections.forEach(sec => {
    const count = (sec.rows || []).length;

    // Summary card
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = '<div class="num ' + (count === 0 ? "zero" : "") + '">' + count + '</div>' +
      '<div class="label">' + escapeHtml(sec.title) + '</div>';
    summaryEl.appendChild(card);

    // Panel
    const panel = document.createElement("section");
    panel.className = "panel";

    const header = document.createElement("div");
    header.className = "panel-header";
    header.innerHTML = '<span>' + escapeHtml(sec.title) + '</span><span class="count">' + count + ' row(s)</span>';

    const body = document.createElement("div");
    body.className = "table-wrap";
    body.style.display = "block";

    if (count === 0) {
      body.innerHTML = '<div class="empty-msg">✅ No issues found in this category.</div>';
    } else {
      let html = "<table><thead><tr>";
      sec.columns.forEach(c => html += "<th>" + escapeHtml(c) + "</th>");
      html += "</tr></thead><tbody>";
      sec.rows.forEach(row => {
        html += "<tr>";
        row.forEach(cell => html += "<td>" + escapeHtml(cell) + "</td>");
        html += "</tr>";
      });
      html += "</tbody></table>";
      body.innerHTML = html;
    }

    header.addEventListener("click", () => {
      body.style.display = body.style.display === "none" ? "block" : "none";
    });

    panel.appendChild(header);
    panel.appendChild(body);
    sectionsEl.appendChild(panel);
  });

  if (sections.length === 0) {
    sectionsEl.innerHTML = '<div class="empty-msg">No section data returned.</div>';
  }
}

// Auto-load on page open if a URL is already saved
window.addEventListener("DOMContentLoaded", () => {
  document.getElementById("configUrl").value = getWebAppUrl();
  if (getWebAppUrl()) loadData();
});
</script>

</body>
</html>
