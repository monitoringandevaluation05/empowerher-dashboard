<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EmpowerHer — Data Quality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2ecdd; --ink:#1b2724; --muted:#5e6d64;
    --card:#ffffff; --card-alt:#faf5e7;
    --accent:#b9842a; --accent-ink:#5c3f10;
    --good:#3f8a52; --good-soft:#e4f0e3;
    --warn:#b9842a; --warn-soft:#fbf0dc;
    --bad:#be5a43; --bad-soft:#f8e8e2;
    --border:#e1d8c2; --masthead:#16262a; --masthead-ink:#f2ecdd;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#121b1a; --ink:#f2ecdd; --muted:#9fb3ac;
      --card:#1b2724; --card-alt:#1f2d29;
      --accent:#d9a441; --accent-ink:#2b1c06;
      --good:#5fae6b; --good-soft:#1c2e22;
      --warn:#d9a441; --warn-soft:#2e2611;
      --bad:#c1584a; --bad-soft:#301e1a;
      --border:#2c3e39; --masthead:#0e1718; --masthead-ink:#f2ecdd;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#121b1a; --ink:#f2ecdd; --muted:#9fb3ac;
    --card:#1b2724; --card-alt:#1f2d29;
    --accent:#d9a441; --accent-ink:#2b1c06;
    --good:#5fae6b; --good-soft:#1c2e22;
    --warn:#d9a441; --warn-soft:#2e2611;
    --bad:#c1584a; --bad-soft:#301e1a;
    --border:#2c3e39; --masthead:#0e1718; --masthead-ink:#f2ecdd;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; scroll-padding-top:128px;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body::before{
    content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px);
    background:var(--masthead); z-index:40;
  }
  h1,h2,.serif{font-family:"Fraunces",Georgia,serif;}

  /* ---------- masthead ---------- */
  header.masthead{
    background:var(--masthead); color:var(--masthead-ink);
    padding:34px clamp(18px,5vw,48px) 26px;
    border-bottom:1px solid rgba(242,236,221,0.12);
  }
  .masthead-row{display:flex; justify-content:space-between; align-items:flex-end; gap:24px; flex-wrap:wrap;}
  .masthead-eyebrow{font-size:0.78rem; color:#c7a96a; letter-spacing:0.02em; margin:0 0 6px;}
  header.masthead h1{font-size:clamp(1.9rem,4vw,2.6rem); font-weight:600; margin:0; line-height:1.08;}
  header.masthead .sub{font-family:"Fraunces",serif; font-style:italic; font-weight:500; color:#c7a96a; font-size:1.05rem; margin-top:6px;}
  .masthead-meta{font-size:0.8rem; color:#a9b8b2; text-align:right;}
  .masthead-meta .dot{color:var(--accent);}
  button#refreshBtn{
    margin-top:10px; background:var(--accent); color:var(--accent-ink); border:none; border-radius:4px;
    padding:9px 18px; font-weight:600; cursor:pointer; font-size:0.84rem; font-family:"IBM Plex Sans",sans-serif;
    display:inline-flex; align-items:center; gap:7px;
  }
  button#refreshBtn:hover{filter:brightness(1.08);}
  button#refreshBtn .spin{display:inline-block; transition:transform 0.5s;}
  button#refreshBtn.loading .spin{animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  nav.sectionNav{
    position:sticky; top:0; z-index:35;
    display:flex; gap:4px; overflow-x:auto; padding:9px clamp(18px,5vw,48px);
    background:var(--masthead); border-bottom:1px solid rgba(242,236,221,0.12);
    -webkit-overflow-scrolling:touch; scrollbar-width:thin;
  }
  nav.sectionNav::-webkit-scrollbar{height:4px;}
  nav.sectionNav a{
    flex:0 0 auto; display:inline-flex; align-items:center; gap:7px;
    color:#c7cfca; text-decoration:none; font-size:0.8rem; font-weight:500;
    padding:7px 12px; border-radius:3px; border-bottom:2px solid transparent; white-space:nowrap;
    transition:color 0.15s, border-color 0.15s;
  }
  nav.sectionNav a:hover{color:#fff;}
  nav.sectionNav a.active{color:var(--accent); border-bottom-color:var(--accent);}
  nav.sectionNav a .n{font-family:"IBM Plex Mono",monospace; font-size:0.72rem; color:#8a9a93;}
  nav.sectionNav a.active .n{color:var(--accent);}

  main{padding:28px clamp(18px,5vw,48px) 48px; width:100%; margin:0; max-width:none;}

  /* ---------- overview strip ---------- */
  .overview{
    display:flex; gap:0; margin-bottom:30px; border:1px solid var(--border); border-radius:6px;
    overflow:hidden; background:var(--card);
  }
  .overview .dial{
    flex:0 0 auto; width:150px; display:flex; align-items:center; justify-content:center;
    background:var(--card-alt); border-right:1px solid var(--border); padding:14px;
  }
  .overview .dial svg{width:100%; height:auto;}
  .overview .figures{display:flex; flex:1 1 auto; flex-wrap:wrap;}
  .overview .fig{
    flex:1 1 150px; padding:16px 20px; border-right:1px solid var(--border); cursor:pointer;
    transition:background 0.15s;
  }
  .overview .fig:last-child{border-right:none;}
  .overview .fig:hover{background:var(--card-alt);}
  .overview .fig .num{font-family:"Fraunces",serif; font-weight:600; font-size:2rem; line-height:1; color:var(--bad);}
  .overview .fig .num.zero{color:var(--good);}
  .overview .fig .lbl{font-size:0.76rem; color:var(--muted); margin-top:6px; line-height:1.3;}

  section.panel{
    background:var(--card); border:1px solid var(--border); border-radius:6px;
    margin-bottom:20px; overflow:hidden; scroll-margin-top:128px;
  }
  section.panel .panel-header{
    padding:15px 20px; background:var(--card); color:var(--ink);
    display:flex; justify-content:space-between; align-items:center;
    cursor:pointer; flex-wrap:wrap; gap:10px; border-bottom:1px solid var(--border);
  }
  section.panel .panel-header .title-wrap{display:flex; align-items:baseline; gap:10px; min-width:0;}
  section.panel .panel-header .idx{font-family:"IBM Plex Mono",monospace; font-size:0.72rem; color:var(--accent); flex:0 0 auto;}
  section.panel .panel-header .title-text{font-family:"Fraunces",serif; font-weight:600; font-size:1.08rem; overflow-wrap:anywhere;}
  section.panel .panel-header .count{
    font-weight:600; font-family:"IBM Plex Mono",monospace; background:var(--bad-soft); color:var(--bad);
    padding:3px 11px; border-radius:3px; font-size:0.78rem; flex:0 0 auto;
  }
  section.panel .panel-header .count.zero{background:var(--good-soft); color:var(--good);}
  section.panel .panel-header .chev{transition:transform 0.2s; opacity:0.5; flex:0 0 auto;}
  section.panel.collapsed .panel-header .chev{transform:rotate(-90deg);}

  .filter-bar{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px;
    padding:12px 20px; background:var(--card-alt); border-bottom:1px solid var(--border);
  }
  .filter-bar .fgroup{display:flex; flex-direction:column; gap:3px;}
  .filter-bar label{font-size:0.66rem; font-weight:600; color:var(--muted);}
  .filter-bar select{
    font-size:0.82rem; padding:6px 9px; border-radius:3px; border:1px solid var(--border);
    background:var(--card); color:var(--ink); min-width:140px; max-width:220px; font-family:"IBM Plex Sans",sans-serif;
  }
  .filter-bar .spacer{flex:1 1 auto;}
  .filter-bar .btn-reset, .filter-bar .btn-download{
    font-size:0.8rem; font-weight:600; padding:7px 14px; border-radius:3px; border:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:6px; font-family:"IBM Plex Sans",sans-serif;
  }
  .filter-bar .btn-reset{background:transparent; color:var(--muted); border:1px solid var(--border);}
  .filter-bar .btn-reset:hover{background:var(--border);}
  .filter-bar .btn-download{background:var(--accent); color:var(--accent-ink);}
  .filter-bar .btn-download:hover{filter:brightness(1.06);}
  .filter-bar .btn-download:disabled{opacity:0.4; cursor:not-allowed;}

  .scroll-track{
    overflow-x:auto; overflow-y:hidden; height:12px;
    border-bottom:1px solid var(--border); background:var(--card-alt);
  }
  .scroll-track-inner{height:1px;}
  .scroll-track::-webkit-scrollbar{height:8px;}
  .scroll-track::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

  .table-frame{max-height:58vh; overflow:auto; -webkit-overflow-scrolling:touch; position:relative; isolation:isolate;}
  table{border-collapse:separate; border-spacing:0; width:100%; font-size:0.83rem; min-width:max-content;}
  th, td{padding:9px 13px; border-bottom:1px solid var(--border); white-space:nowrap; text-align:left;}
  th{
    background:var(--masthead); color:#e6ddc6; position:sticky; top:0; z-index:3; font-weight:500;
    font-size:0.68rem; letter-spacing:0.02em; background-clip:padding-box; font-family:"IBM Plex Mono",monospace;
  }
  th:first-child, td:first-child{
    position:sticky; left:0; z-index:2; box-shadow:2px 0 4px -2px rgba(0,0,0,0.18);
    background-clip:padding-box; contain:paint;
  }
  th:first-child{ z-index:4; background:var(--masthead); }
  td:first-child{ background:var(--card); font-weight:600; }
  tbody tr:nth-child(even) td{ background:var(--card-alt); }
  tbody tr:nth-child(even) td:first-child{ background:var(--card-alt); }
  tbody tr:nth-child(odd) td:first-child{ background:var(--card); }
  tbody tr:hover td{background:var(--warn-soft);}
  tbody tr:hover td:first-child{background:var(--warn-soft);}
  tbody tr.hiddenRow{display:none;}

  .empty-msg{padding:22px 20px; color:var(--good); font-weight:600; display:flex; align-items:center; gap:8px;}
  .loading, .error-msg{padding:40px; text-align:center; color:var(--muted);}
  .error-msg{color:var(--bad); white-space:pre-line; text-align:left; line-height:1.6;}
  .note{padding:12px 20px 18px; font-size:0.78rem; color:var(--muted); border-top:1px dashed var(--border); font-style:italic;}

  footer{text-align:center; padding:26px; color:var(--muted); font-size:0.78rem; border-top:1px solid var(--border);}

  @media (max-width:640px){
    nav.sectionNav a span.label-text{display:none;}
    .table-frame{max-height:50vh;}
    .overview{flex-direction:column;}
    .overview .dial{width:100%; border-right:none; border-bottom:1px solid var(--border);}
    .overview .fig{border-right:none; border-bottom:1px solid var(--border);}
  }
</style>
</head>
<body>

<header class="masthead">
  <div class="masthead-row">
    <div>
      <p class="masthead-eyebrow">EmpowerHer · Field Data Programme</p>
      <h1>Data Quality</h1>
      <p class="sub">What needs a second look before it reaches the record.</p>
      <button id="refreshBtn" onclick="loadAll()"><span class="spin">⟳</span> Refresh</button>
    </div>
    <div class="masthead-meta">
      <div id="generatedAt">Loading…</div>
    </div>
  </div>
</header>

<nav class="sectionNav" id="sectionNav"></nav>

<main>
  <div class="overview" id="overview"></div>
  <div id="sections"></div>
  <div id="status"></div>
</main>

<footer>
  Reads live from the linked Google Sheet's public export. Nothing is stored here — close the tab, nothing is kept.
</footer>

<script>
// ===== CONFIGURE THIS LINE ONLY =====
const SHEET_ID = "1ETUSd0DlatPcraorNA0541yV3C-LmvtpCMea5gGP-KY";
// =====================================

const SECTIONS_CONFIG = [
  { id: "duplicates",        num: "01", title: "Duplicate records",                    short:"Duplicates",      sheet: "DUPLICATE DATA_FLAT",  expectColumn: "duplicate" },
  { id: "fatherHusbandName", num: "02", title: "Husband / father name missing or invalid", short:"Father name",  sheet: "ERR_FATHER_NAME",      expectColumn: "father" },
  { id: "lowFamilyIncome",   num: "03", title: "Family income below ₹2,000",            short:"Family income",   sheet: "ERR_FAMILY_INCOME",    expectColumn: "family" },
  { id: "lowPersonalIncome", num: "04", title: "Personal income missing for homemaker-type work", short:"Personal income", sheet: "ERR_PERSONAL_INCOME",  expectColumn: "personal" },
  { id: "enterpriseUnknown", num: "05", title: 'Enterprise field left as "???"',        short:"Enterprise",      sheet: "ERR_ENTERPRISE",       expectColumn: "enterprise" }
];

const FILTER_DIMS = [
  { key: "state",     label: "State",          match: "state" },
  { key: "district",  label: "District",       match: "district" },
  { key: "block",     label: "Block",          match: "block" },
  { key: "gram",      label: "Gram Panchayat", match: "gram panchayat" }
];

const EMPTY_STATE_PATTERNS = [/no\s+duplicate/i, /no\s+issues?/i, /no\s+errors?/i, /no\s+records?\s+found/i];

function escapeHtml(str) {
  if (str === null || str === undefined) return "";
  return str.toString()
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function parseCSV(text) {
  var rows = [], row = [], cur = "", q = false, i = 0, c;
  text = text.replace(/^\uFEFF/, "");
  for (; i < text.length; i++) {
    c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i+1] === "\n") i++;
      row.push(cur); cur = ""; rows.push(row); row = [];
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(function (r) { return r.some(function (x) { return String(x).trim() !== ""; }); });
}

function csvUrl(sheetName) {
  return "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
    "/gviz/tq?tqx=out:csv&sheet=" + encodeURIComponent(sheetName) + "&t=" + Date.now();
}

function viaFetch(sheetName) {
  return fetch(csvUrl(sheetName), { cache: "no-store" }).then(function (r) {
    if (!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function (t) {
    if (/^\s*<(!doctype|html)/i.test(t)) throw new Error("Sheet is not shared publicly (or tab name doesn't exist yet)");
    return parseCSV(t);
  });
}

function viaJsonp(sheetName) {
  return new Promise(function (res, rej) {
    var cb = "gv_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    var s = document.createElement("script");
    var to = setTimeout(function () { cl(); rej(new Error("timeout")); }, 15000);
    function cl() { clearTimeout(to); delete window[cb]; s.remove(); }
    window[cb] = function (j) {
      cl();
      if (!j || j.status !== "ok" || !j.table) return rej(new Error("Sheet not shared publicly (or tab name doesn't exist yet)"));
      var cols = j.table.cols.map(function (c) { return c.label || c.id; });
      res([cols].concat(j.table.rows.map(function (r) {
        return (r.c || []).map(function (c) { return c ? (c.f != null && c.f !== "" ? c.f : (c.v == null ? "" : c.v)) : ""; });
      })));
    };
    s.onerror = function () { cl(); rej(new Error("blocked")); };
    s.src = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
      "/gviz/tq?tqx=out:json;responseHandler:" + cb + "&sheet=" + encodeURIComponent(sheetName) + "&headers=1";
    document.head.appendChild(s);
  });
}

function loadSheet(sheetName) {
  return viaFetch(sheetName).catch(function () { return viaJsonp(sheetName); });
}

function isEmptyStateTable(table) {
  if (table.length === 1 && table[0].length <= 2) {
    var text = table[0].join(" ").trim();
    return EMPTY_STATE_PATTERNS.some(function (re) { return re.test(text); });
  }
  return false;
}

async function loadAll() {
  const statusEl = document.getElementById("status");
  const genEl = document.getElementById("generatedAt");
  const btn = document.getElementById("refreshBtn");
  btn.classList.add("loading");
  statusEl.innerHTML = '<div class="loading">Loading latest data…</div>';
  genEl.textContent = "Loading…";

  const results = [];
  for (const cfg of SECTIONS_CONFIG) {
    try {
      const table = await loadSheet(cfg.sheet);

      if (table.length === 0 || isEmptyStateTable(table)) {
        results.push({ id: cfg.id, num: cfg.num, title: cfg.title, short: cfg.short, columns: [], rows: [], error: null, explicitEmpty: true });
        continue;
      }

      const headers = table[0];

      if (cfg.expectColumn) {
        const hasExpected = headers.some(h => String(h).toLowerCase().includes(cfg.expectColumn));
        if (!hasExpected) {
          results.push({
            id: cfg.id, num: cfg.num, title: cfg.title, short: cfg.short, columns: [], rows: [], explicitEmpty: false,
            error: 'This came back without a "' + cfg.expectColumn + '"-type column, so the tab named "' + cfg.sheet +
              '" probably doesn\'t exist right now (or its name doesn\'t match exactly) and Google served the workbook\'s ' +
              'first tab instead. Check the tab name in the Sheet, then Refresh.'
          });
          continue;
        }
      }

      let rows = table.slice(1);

      if (cfg.id === "duplicates") {
        let last = "";
        rows = rows.map(r => {
          const copy = r.slice();
          if (String(copy[0]).trim() === "") copy[0] = last; else last = copy[0];
          return copy;
        });
      }

      results.push({ id: cfg.id, num: cfg.num, title: cfg.title, short: cfg.short, columns: headers, rows: rows, error: null, explicitEmpty: false });
    } catch (err) {
      results.push({ id: cfg.id, num: cfg.num, title: cfg.title, short: cfg.short, columns: [], rows: [], error: err.message, explicitEmpty: false });
    }
  }

  statusEl.innerHTML = "";
  genEl.innerHTML = "Last synced <span class='dot'>·</span> " + new Date().toLocaleString();
  btn.classList.remove("loading");
  render(results);
}

function buildNav(sections) {
  const nav = document.getElementById("sectionNav");
  nav.innerHTML = sections.map(sec => {
    const count = sec.error ? "–" : sec.rows.length;
    return '<a href="#panel-' + sec.id + '" data-target="panel-' + sec.id + '">' +
      '<span class="label-text">' + escapeHtml(sec.short) + '</span>' +
      '<span class="n">' + count + '</span>' +
      '</a>';
  }).join("");

  nav.querySelectorAll("a").forEach(a => {
    a.addEventListener("click", () => {
      nav.querySelectorAll("a").forEach(x => x.classList.remove("active"));
      a.classList.add("active");
    });
  });
}

function wireTopScrollbar(track, trackInner, frame, table) {
  trackInner.style.width = table.scrollWidth + "px";
  let syncing = false;
  track.addEventListener("scroll", () => {
    if (syncing) return; syncing = true;
    frame.scrollLeft = track.scrollLeft;
    syncing = false;
  });
  frame.addEventListener("scroll", () => {
    if (syncing) return; syncing = true;
    track.scrollLeft = frame.scrollLeft;
    syncing = false;
  });
  window.addEventListener("resize", () => { trackInner.style.width = table.scrollWidth + "px"; });
}

function csvEscape(v) {
  const s = v === null || v === undefined ? "" : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function downloadCSV(filename, headers, rows) {
  const lines = [headers.map(csvEscape).join(",")].concat(rows.map(r => r.map(csvEscape).join(",")));
  const blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function buildFilterBar(sec, headers, rows, trEls, panel, countBadge) {
  const colIdx = {};
  FILTER_DIMS.forEach(d => {
    colIdx[d.key] = headers.findIndex(h => String(h).toLowerCase().includes(d.match));
  });
  const activeDims = FILTER_DIMS.filter(d => colIdx[d.key] !== -1);
  if (activeDims.length === 0) return null;

  const filters = {}; activeDims.forEach(d => filters[d.key] = "");

  const bar = document.createElement("div");
  bar.className = "filter-bar";

  const selects = {};
  activeDims.forEach(d => {
    const group = document.createElement("div");
    group.className = "fgroup";
    const label = document.createElement("label");
    label.textContent = d.label;
    const select = document.createElement("select");
    select.dataset.dim = d.key;
    group.appendChild(label);
    group.appendChild(select);
    bar.appendChild(group);
    selects[d.key] = select;
  });

  const spacer = document.createElement("div");
  spacer.className = "spacer";
  bar.appendChild(spacer);

  const resetBtn = document.createElement("button");
  resetBtn.className = "btn-reset";
  resetBtn.textContent = "Reset filters";
  bar.appendChild(resetBtn);

  const dlBtn = document.createElement("button");
  dlBtn.className = "btn-download";
  dlBtn.innerHTML = "⬇ Download CSV";
  bar.appendChild(dlBtn);

  function rowMatches(row, excludeDim) {
    return activeDims.every(d => {
      if (d.key === excludeDim) return true;
      if (!filters[d.key]) return true;
      return String(row[colIdx[d.key]]).trim() === filters[d.key];
    });
  }

  function refreshOptions() {
    activeDims.forEach(d => {
      const current = filters[d.key];
      const opts = Array.from(new Set(
        rows.filter(r => rowMatches(r, d.key)).map(r => String(r[colIdx[d.key]]).trim()).filter(Boolean)
      )).sort((a, b) => a.localeCompare(b));

      const select = selects[d.key];
      const keep = opts.includes(current) ? current : "";
      if (keep !== current) filters[d.key] = keep;
      select.innerHTML = '<option value="">All ' + d.label + '</option>' +
        opts.map(o => '<option value="' + escapeHtml(o) + '"' + (o === keep ? " selected" : "") + '>' + escapeHtml(o) + "</option>").join("");
    });
  }

  function applyFilters() {
    let visibleCount = 0;
    rows.forEach((r, i) => {
      const show = rowMatches(r, null);
      trEls[i].classList.toggle("hiddenRow", !show);
      if (show) visibleCount++;
    });
    countBadge.textContent = visibleCount + " row(s)" + (visibleCount !== rows.length ? " of " + rows.length : "");
    dlBtn.disabled = visibleCount === 0;
    return visibleCount;
  }

  Object.keys(selects).forEach(key => {
    selects[key].addEventListener("change", () => {
      filters[key] = selects[key].value;
      refreshOptions();
      applyFilters();
    });
  });

  resetBtn.addEventListener("click", () => {
    activeDims.forEach(d => filters[d.key] = "");
    refreshOptions();
    applyFilters();
  });

  dlBtn.addEventListener("click", () => {
    const visibleRows = rows.filter((r) => rowMatches(r, null));
    const namePart = activeDims
      .filter(d => filters[d.key])
      .map(d => filters[d.key].replace(/[^a-z0-9]+/gi, "_"))
      .join("_");
    const filename = sec.id + (namePart ? "_" + namePart : "_all") + ".csv";
    downloadCSV(filename, headers, visibleRows);
  });

  refreshOptions();
  applyFilters();

  return bar;
}

function buildOverview(sections) {
  const el = document.getElementById("overview");
  const totalFlagged = sections.reduce((sum, s) => sum + (s.error ? 0 : s.rows.length), 0);
  const totalClean = sections.filter(s => !s.error && (s.explicitEmpty || s.rows.length === 0)).length;

  const r = 52, c = 2 * Math.PI * r;
  const pct = Math.min(totalFlagged / 400, 1); // visual scale, not a literal percentage
  const offset = c * (1 - pct);

  el.innerHTML =
    '<div class="dial"><svg viewBox="0 0 120 120">' +
      '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="var(--border)" stroke-width="10"/>' +
      '<circle cx="60" cy="60" r="' + r + '" fill="none" stroke="var(--accent)" stroke-width="10" ' +
        'stroke-dasharray="' + c + '" stroke-dashoffset="' + offset + '" stroke-linecap="round" transform="rotate(-90 60 60)"/>' +
      '<text x="60" y="56" text-anchor="middle" font-family="Fraunces, serif" font-weight="600" font-size="26" fill="var(--ink)">' + totalFlagged + '</text>' +
      '<text x="60" y="76" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="9" fill="var(--muted)">flagged rows</text>' +
    '</svg></div>' +
    '<div class="figures">' +
    sections.map(sec => {
      const n = sec.error ? "?" : (sec.explicitEmpty ? 0 : sec.rows.length);
      const zero = !sec.error && n === 0;
      return '<div class="fig" onclick="document.getElementById(\'panel-' + sec.id + '\').scrollIntoView({behavior:\'smooth\',block:\'start\'})">' +
        '<div class="num' + (zero ? " zero" : "") + '">' + n + '</div>' +
        '<div class="lbl">' + escapeHtml(sec.title) + '</div></div>';
    }).join('') +
    '</div>';
}

function render(sections) {
  const sectionsEl = document.getElementById("sections");
  sectionsEl.innerHTML = "";

  buildNav(sections);
  buildOverview(sections);

  const anyFatalError = sections.every(s => s.error);
  if (anyFatalError) {
    document.getElementById("status").innerHTML =
      '<div class="error-msg">⚠️ Could not read the Google Sheet.\n\n' +
      '1) In the Sheet, click Share → General access → set to "Anyone with the link" (Viewer).\n' +
      '2) Make sure tab names in the Sheet exactly match: DUPLICATE DATA_FLAT, ERR_FATHER_NAME, ERR_FAMILY_INCOME, ERR_PERSONAL_INCOME, ERR_ENTERPRISE.\n' +
      '3) Run generateDuplicateReport() and generateErrorReport() at least once so these tabs exist.</div>';
  }

  sections.forEach(sec => {
    const count = sec.error ? null : sec.rows.length;
    const isZero = sec.explicitEmpty || count === 0;

    const panel = document.createElement("section");
    panel.className = "panel";
    panel.id = "panel-" + sec.id;

    const header = document.createElement("div");
    header.className = "panel-header";
    const countLabel = sec.error ? "error" : (isZero ? "0 rows" : count + " row" + (count === 1 ? "" : "s"));
    header.innerHTML =
      '<div class="title-wrap"><span class="idx">' + sec.num + '</span><span class="title-text">' + escapeHtml(sec.title) + '</span></div>' +
      '<span class="count' + (sec.error ? "" : isZero ? " zero" : "") + '">' + countLabel + '</span>' +
      '<span class="chev">▾</span>';

    panel.appendChild(header);
    const countBadge = header.querySelector(".count");

    if (sec.error) {
      const body = document.createElement("div");
      body.innerHTML = '<div class="error-msg">' + escapeHtml(sec.error) + '</div>';
      panel.appendChild(body);
    } else if (isZero) {
      const body = document.createElement("div");
      body.innerHTML = '<div class="empty-msg">✓ Nothing flagged here right now.</div>';
      panel.appendChild(body);
    } else {
      const trEls = [];

      const frame = document.createElement("div");
      frame.className = "table-frame";

      const tableEl = document.createElement("table");
      const thead = document.createElement("thead");
      const headTr = document.createElement("tr");
      sec.columns.forEach(c => {
        const th = document.createElement("th");
        th.textContent = c;
        headTr.appendChild(th);
      });
      thead.appendChild(headTr);
      const tbody = document.createElement("tbody");
      sec.rows.forEach(row => {
        const tr = document.createElement("tr");
        row.forEach(cell => {
          const td = document.createElement("td");
          td.textContent = cell;
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
        trEls.push(tr);
      });
      tableEl.appendChild(thead);
      tableEl.appendChild(tbody);
      frame.appendChild(tableEl);

      const filterBar = buildFilterBar(sec, sec.columns, sec.rows, trEls, panel, countBadge);
      if (filterBar) panel.appendChild(filterBar);

      const track = document.createElement("div");
      track.className = "scroll-track";
      const trackInner = document.createElement("div");
      trackInner.className = "scroll-track-inner";
      track.appendChild(trackInner);

      panel.appendChild(track);
      panel.appendChild(frame);

      requestAnimationFrame(() => wireTopScrollbar(track, trackInner, frame, tableEl));
    }

    header.addEventListener("click", () => {
      const filterBarEl = panel.querySelector(".filter-bar");
      const scrollTrack = panel.querySelector(".scroll-track");
      const frameEl = panel.querySelector(".table-frame");
      const simpleBody = panel.querySelector(".empty-msg, .error-msg");
      const nowHidden = panel.classList.toggle("collapsed");
      if (filterBarEl) filterBarEl.style.display = nowHidden ? "none" : "flex";
      if (scrollTrack) scrollTrack.style.display = nowHidden ? "none" : "block";
      if (frameEl) frameEl.style.display = nowHidden ? "none" : "block";
      if (simpleBody) simpleBody.style.display = nowHidden ? "none" : "flex";
    });

    if (sec.id === "duplicates" && !sec.error) {
      const note = document.createElement("div");
      note.className = "note";
      note.textContent = "Every row in a matching set is shown — not just one — grouped under a Duplicate Series No, so you can compare copies before deciding which to keep.";
      panel.appendChild(note);
    }

    sectionsEl.appendChild(panel);
  });

  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      const link = document.querySelector('nav.sectionNav a[data-target="' + e.target.id + '"]');
      if (!link) return;
      if (e.isIntersecting) {
        document.querySelectorAll("nav.sectionNav a").forEach(a => a.classList.remove("active"));
        link.classList.add("active");
      }
    });
  }, { rootMargin: "-128px 0px -70% 0px" });
  document.querySelectorAll("section.panel").forEach(p => io.observe(p));
}

loadAll();
</script>

</body>
